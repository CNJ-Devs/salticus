name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-language.mjs --history
      - run: npm test
      - run: npm run package
      - if: runner.os == 'macOS'
        run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: salticus-preview-${{ matrix.os }}
          path: dist/packages/*
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: salticus-macos-installers
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
